name: Compile Revised Manuscript

on:
  workflow_dispatch:
  push:
    paths:
      - "manuscript/**"
      - "results/*.png"
      - ".github/workflows/manuscript.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Compile twice
        working-directory: manuscript
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error APG_AMS_revised.tex
          pdflatex -interaction=nonstopmode -halt-on-error APG_AMS_revised.tex
      - uses: actions/upload-artifact@v4
        with:
          name: APG-AMS-revised-manuscript
          path: manuscript/APG_AMS_revised.pdf
