name: Full Reviewer Reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce.yml"

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Full 10-fold comparison
        run: python scripts/run_revision_experiments.py
      - name: Figures and reviewer draft
        run: python scripts/generate_revision_report.py
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/REVIEWER_RESPONSE_DRAFT.md
          git diff --cached --quiet || git commit -m "Add reproducible reviewer-validation results [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: apg-ams-reviewer-evidence
          path: |
            results/**
            docs/REVIEWER_RESPONSE_DRAFT.md
